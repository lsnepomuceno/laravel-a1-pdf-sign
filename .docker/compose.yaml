# Local reproduction of the CI matrix.
#
#   docker compose -f .docker/compose.yaml run --rm php   composer install
#   docker compose -f .docker/compose.yaml run --rm php   vendor/bin/pest
#   docker compose -f .docker/compose.yaml run --rm php85 composer check
#
# The `php` service (8.4 by default) covers day-to-day work; php83 and php85
# cover the edges of the matrix. Each service keeps `vendor/` in its own named
# volume so switching PHP versions does not invalidate the other install.

x-php: &php
  build:
    context: ..
    dockerfile: .docker/Dockerfile
  working_dir: /app
  volumes:
    - ../:/app
  environment:
    COMPOSER_CACHE_DIR: /tmp/composer-cache

services:
  php:
    <<: *php
    build:
      context: ..
      dockerfile: .docker/Dockerfile
      args:
        PHP_VERSION: "8.4"
    volumes:
      - ../:/app
      - vendor-84:/app/vendor

  php83:
    <<: *php
    build:
      context: ..
      dockerfile: .docker/Dockerfile
      args:
        PHP_VERSION: "8.3"
    volumes:
      - ../:/app
      - vendor-83:/app/vendor

  php85:
    <<: *php
    build:
      context: ..
      dockerfile: .docker/Dockerfile
      args:
        PHP_VERSION: "8.5"
    volumes:
      - ../:/app
      - vendor-85:/app/vendor

  # The PDF/A group, which needs veraPDF and therefore a JRE. Kept out of the
  # services above so day-to-day work does not carry ~150 MB for a check that
  # runs on one group:
  #
  #   docker compose -f .docker/compose.yaml run --rm pdfa vendor/bin/pest --group=pdfa
  #
  # It shares vendor-84 with the `php` service, so `composer install` done in
  # either is seen by both.
  pdfa:
    <<: *php
    build:
      context: ..
      dockerfile: .docker/Dockerfile
      args:
        PHP_VERSION: "8.4"
        WITH_VERAPDF: "true"
    volumes:
      - ../:/app
      - vendor-84:/app/vendor

volumes:
  vendor-83:
  vendor-84:
  vendor-85:
