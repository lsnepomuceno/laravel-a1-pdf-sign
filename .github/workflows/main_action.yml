name: A1 Pdf Sign Tests

on:
  pull_request:
    branches: [ main, dev, v1.x-dev, v2.x-dev ]
  push:
    branches: [ main, dev, v1.x-dev, v2.x-dev ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Laravel 12 supports PHP 8.2-8.5 and Laravel 13 supports PHP 8.3-8.5.
        # The package floor is PHP 8.4, so every combination below is valid with
        # no exclusions. See ARCHITECTURE-V2.md §3e.
        php: [ '8.4', '8.5' ]
        laravel: [ '12.*', '13.*' ]

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, openssl, json, gd, imagick, bcmath, sqlite3
          coverage: pcov

      - name: Validate PHP and Composer
        run: |
          php -v
          composer -V
          composer validate

      - name: Configure Laravel version
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" \
                           "illuminate/encryption:${{ matrix.laravel }}" \
                           "illuminate/http:${{ matrix.laravel }}" \
                           --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test

  quality:
    name: Code style and static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, openssl, json, gd, imagick, bcmath, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Check dependencies
        run: vendor/bin/composer-dependency-analyser

      - name: Check composer.json formatting
        run: composer normalize --dry-run

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # src/ is fully typed as of PR 5; the gate keeps it that way.
      - name: Check type coverage
        run: vendor/bin/pest --type-coverage --min=100

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    # Only when the code it covers changes: a full run takes minutes.
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, openssl, json, gd, imagick, bcmath, sqlite3
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # The floor is the value measured when mutation testing landed. Raise it
      # as the score improves; never lower it to make a run pass.
      - name: Run mutation testing
        run: composer test:mutate
